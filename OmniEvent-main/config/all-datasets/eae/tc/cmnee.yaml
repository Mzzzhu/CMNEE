seed: 42
do_train: True
do_predict: True

# top-level config #
paradigm: token_classification
task_name: EAE
dataset_name: cmnee
language: Chinese
test_exists_labels: True

# file path #
output_dir: output/cmnee/tc
type2id_path: path to cmnee_omnievent/label2id.json
role2id_path: path to cmnee_omnievent/role2id.json
train_file: path to cmnee_omnievent/train.unified.jsonl
validation_file: path to cmnee_omnievent/valid.unified.jsonl
test_file: path to cmnee_omnievent/test.unified.jsonl
# event detection predictions
golden_trigger: False 
train_pred_file: path to ed output/train_preds.json
validation_pred_file: path to ed output/valid_preds.json
test_pred_file: path to ed output/test_preds.json
# config for some specific paradigms

# config for data processor #
truncate_in_batch: True
return_token_type_ids: False

# model config #
model_type: bert
model_name_or_path: ../../../../../../../data/MODELS/bert-base-uncased
hidden_size: 768
aggregation: marker
head_scale: 2

# training config #
num_train_epochs: 5
max_seq_length: 160
dataloader_num_workers: 2

per_device_train_batch_size: 32
per_device_eval_batch_size: 64
gradient_accumulation_steps: 2
# eval_accumulation_steps: 4
learning_rate: 3.0e-5
weight_decay: 1.0e-5
warmup_ratio: 0.1
max_grad_norm: 1
optim: adamw_torch

load_best_model_at_end: True
metric_for_best_model: micro_f1
greater_is_better: True

logging_strategy: steps
logging_steps: 100
evaluation_strategy: epoch
eval_steps: 500
save_strategy: epoch
save_steps: 500

# evaluate/test config #
eae_eval_mode: loose

# split inference #
split_infer: False
split_infer_size: 5000